<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151f"><title>Xiaoen Ledger</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9edf6;background:#10151f}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 18px 90px}h1{font-size:25px}h2{font-size:18px}.muted{color:#9ca9bf}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel{background:#1b2433;border:1px solid #344056;border-radius:17px;padding:17px}.card strong{font-size:23px;display:block;margin-top:8px}button,input,select{font:inherit;border-radius:11px;padding:12px;border:1px solid #42506a}input,select{background:#111a28;color:white;width:100%}button{background:#5377d6;color:white;cursor:pointer;border:0}button.secondary{background:#334259}button.danger{background:#703b49}form{display:grid;gap:10px}.panel{margin-top:18px}.line{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #344056}.line:last-child{border:0}.actions{display:flex;gap:8px}.actions input{min-width:0;flex:1}.actions #year{flex:1.5}.actions #setToday{white-space:nowrap}.actions button{padding:7px 10px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}small{color:#9ca9bf}@media(max-width:440px){.card strong{font-size:19px}.toolbar{align-items:start;flex-direction:column}}
</style></head><body><main><header><small>PERSONAL FINANCE · 本機原型</small><h1>我的財務總覽</h1><p class="muted">資料只儲存在目前瀏覽器，尚未雲端同步。請定期匯出備份。</p></header>
<section class="cards"><div class="card"><small>本月收入</small><strong id="income">$0</strong></div><div class="card"><small>本月支出</small><strong id="expense">$0</strong></div><div class="card"><small>本月結餘</small><strong id="balance">$0</strong></div><div class="card"><small>累計淨收支</small><strong id="allBalance">$0</strong></div></section>
<section class="panel"><h2 id="formTitle">新增紀錄</h2><form id="form"><input type="hidden" id="editId"><label>類型<select id="type"><option value="expense">支出</option><option value="income">收入</option></select></label><label>金額（新台幣）<input id="amount" type="number" min="1" step="1" required inputmode="numeric"></label><label>分類<select id="category"></select></label><label>日期（預設今天）<div class="actions"><input id="year" type="text" inputmode="numeric" maxlength="4" placeholder="年" aria-label="年" required><input id="month" type="text" inputmode="numeric" maxlength="2" placeholder="月" aria-label="月" required><input id="day" type="text" inputmode="numeric" maxlength="2" placeholder="日" aria-label="日" required><button type="button" class="secondary" id="setToday">今天</button></div></label><label>備註<input id="note" maxlength="200" placeholder="例如：晚餐、薪水、貓砂"></label><div class="actions"><button type="submit">儲存紀錄</button><button type="button" class="secondary" id="cancel">取消編輯</button></div></form></section>
<p id="status" role="status" aria-live="polite" class="muted"></p><section class="panel"><div class="toolbar"><h2>交易紀錄</h2><div class="actions"><button class="secondary" id="export">匯出 JSON</button><button class="secondary" id="importBtn">匯入 JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="secondary" id="exportCsv">匯出 CSV</button></div></div><div id="records"></div></section></main>
<script>
const KEY='xiaoen-ledger-v1';
const cats={expense:['餐飲','交通','購物','養貓','汽車','娛樂','居家','醫療','其他'],income:['薪水','業績獎金','年終','副業','其他']};
let rows=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))rows=v}catch{}
const el=id=>document.getElementById(id),fmt=n=>'NT$ '+n.toLocaleString('zh-TW');
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function setDate(value){const [y,m,d]=value.split('-');el('year').value=y;el('month').value=Number(m);el('day').value=Number(d)}
function getDate(){const y=el('year').value,m=el('month').value,d=el('day').value;if(!/^\\d{4}$/.test(y)||!/^\\d{1,2}$/.test(m)||!/^\\d{1,2}$/.test(d))return null;const dt=new Date(Number(y),Number(m)-1,Number(d));if(dt.getFullYear()!==Number(y)||dt.getMonth()+1!==Number(m)||dt.getDate()!==Number(d))return null;return y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0')}
setDate(today());el('setToday').onclick=()=>setDate(today());
[['year','month',4],['month','day',2]].forEach(([a,b,len])=>el(a).addEventListener('input',()=>{if(el(a).value.length===len)el(b).focus()}));
function categories(){el('category').replaceChildren(...cats[el('type').value].map(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;return o}))}
el('type').addEventListener('change',categories);categories();
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));return true}catch(e){alert('無法儲存：瀏覽器禁止本機儲存。請使用正式網站網址開啟，避免 GitHub 檔案預覽或無痕模式。');return false}}
function render(){const month=today().slice(0,7),sum=(items,t)=>items.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0),current=rows.filter(x=>x.date.slice(0,7)===month),inc=sum(current,'income'),exp=sum(current,'expense');el('income').textContent=fmt(inc);el('expense').textContent=fmt(exp);el('balance').textContent=fmt(inc-exp);el('allBalance').textContent=fmt(sum(rows,'income')-sum(rows,'expense'));const list=el('records');list.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='muted';p.textContent='尚無交易紀錄';list.append(p)}for(const x of [...rows].sort((a,b)=>b.date.localeCompare(a.date))){const item=document.createElement('div');item.className='line';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=x.category+' · '+fmt(x.amount*(x.type==='expense'?-1:1));const detail=document.createElement('div');detail.className='muted';detail.textContent=x.date+(x.note?' · '+x.note:'');info.append(title,detail);const actions=document.createElement('div');actions.className='actions';for(const [label,fn,cls] of [['編輯',()=>edit(x.id),'secondary'],['刪除',()=>remove(x.id),'danger']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;actions.append(b)}item.append(info,actions);list.append(item)}}}
function reset(){el('form').reset();el('editId').value='';setDate(today());el('formTitle').textContent='新增紀錄';categories()}
el('cancel').onclick=reset;
el('form').onsubmit=e=>{e.preventDefault();const amount=Number(el('amount').value);if(!Number.isSafeInteger(amount)||amount<=0)return alert('請輸入有效的正整數金額');const id=el('editId').value;const date=getDate();if(!date)return alert('請確認年月日正確');const record={id:id||('t-'+Date.now()+'-'+Math.random().toString(36).slice(2)),type:el('type').value,amount,category:el('category').value,date,note:el('note').value.trim()};const next=id?rows.map(x=>x.id===id?record:x):[...rows,record];if(!save(next))return;rows=next;reset();render();el('status').textContent='✓ 已成功儲存 '+fmt(amount)};
function edit(id){const x=rows.find(x=>x.id===id);if(!x)return;el('editId').value=x.id;el('type').value=x.type;categories();el('amount').value=x.amount;el('category').value=x.category;setDate(x.date);el('note').value=x.note;el('formTitle').textContent='編輯紀錄';window.scrollTo({top:250,behavior:'smooth'})}
function remove(id){if(confirm('確定刪除這筆紀錄？')){const next=rows.filter(x=>x.id!==id);if(save(next)){rows=next;render();el('status').textContent='已刪除紀錄'}}}
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
el('importBtn').onclick=()=>el('importFile').click();
el('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed)||!parsed.every(x=>x&&typeof x.id==='string'&&['income','expense'].includes(x.type)&&Number.isSafeInteger(x.amount)&&x.amount>0&&typeof x.category==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(x.date)&&typeof x.note==='string'))throw Error('格式不符');if(!confirm('匯入會取代目前全部紀錄。請先匯出現有備份，確定繼續？'))return;if(!save(parsed))return;rows=parsed;render();el('status').textContent='✓ 已匯入 '+parsed.length+' 筆紀錄'}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
el('export').onclick=()=>download(JSON.stringify(rows,null,2),'xiaoen-ledger-'+today()+'.json','application/json');
el('exportCsv').onclick=()=>{const fields=['id','date','type','category','amount','note'];const csv=[fields.join(','),...rows.map(x=>fields.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');download('\uFEFF'+csv,'xiaoen-ledger-'+today()+'.csv','text/csv;charset=utf-8')};
render();
</script></body></html>
