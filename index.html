<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1018"><title>Xiaoen Ledger</title>
<style>
:root{color-scheme:dark;font:14px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#ecedf5;background:#0e1018}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 0 0,rgba(111,91,153,.13),transparent 42%),radial-gradient(ellipse at 100% 70%,rgba(66,91,131,.1),transparent 48%),#0e1018}
main{max-width:1120px;margin:auto;padding:30px 24px 85px}
h1{font-size:23px;letter-spacing:-.03em;margin:0}h2{font-size:16px;letter-spacing:-.01em;margin:0 0 14px}small,.muted{color:#9298a9}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 20px;margin-bottom:28px;border:1px solid rgba(214,213,255,.11);border-radius:16px;background:rgba(255,255,255,.035);backdrop-filter:blur(18px)}
header small:first-child{display:block;color:#ac9bf0;font-size:10px;letter-spacing:.12em;margin-bottom:4px}header small:last-child{max-width:290px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.panel,.tile{background:rgba(255,255,255,.035);border:1px solid rgba(218,217,252,.11);border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.07);backdrop-filter:blur(14px)}
.panel{padding:20px}.tile{padding:15px 17px;min-height:98px}
.tile small{font-size:12px}.tile b{display:block;font-size:22px;letter-spacing:-.035em;margin-top:8px;font-variant-numeric:tabular-nums}
#net{color:#75cda6}#expense{color:#eb8795}
section{margin:16px 0}.workspace{display:grid;grid-template-columns:1fr 1.1fr;align-items:start;gap:16px;margin-top:20px}.workspace section{margin:0}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px}.summary h2{margin:0}.summary+*{margin-top:13px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);min-height:39px;display:inline-flex;justify-content:center;align-items:center;gap:7px;padding:8px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.quick button span:first-child{font-size:15px;line-height:1;filter:saturate(.55)}
.quick button:hover,.quick button:focus-visible{border-color:rgba(158,136,248,.65);background:rgba(139,116,216,.17)}
button,input,select{font:inherit;border-radius:9px;padding:10px 12px}
button{background:#8065c1;border:1px solid transparent;color:#fff;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{filter:brightness(1.13)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b69af0;outline-offset:2px}
button.alt{background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.1);color:#d4d5e1}button.warn{background:rgba(176,71,94,.12);border-color:rgba(204,108,129,.22);color:#eeb6bf}
input,select{background:rgba(7,9,16,.38);border:1px solid rgba(224,224,255,.17);color:#f3f1fb;width:100%;min-width:0}
input::placeholder{color:#7c8495}label{display:grid;gap:5px;font-size:12px;color:#a9afc1}
form{display:grid;gap:10px}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.row.wrap{flex-wrap:wrap}.row button{flex-shrink:0}
.tabs{display:flex;gap:6px;margin:0 0 13px}.tabs button{flex:1;padding:8px}.selected{background:rgba(131,99,207,.58)!important;border-color:rgba(196,164,250,.4)!important}
.hidden{display:none!important}
#entry{grid-template-columns:1fr 1fr;gap:11px}#entry>label:first-of-type{grid-column:1}#entry>label:nth-of-type(2){grid-column:2}#entry>label:nth-of-type(3),#entry>label:nth-of-type(4),#entry>.row{grid-column:1/-1}
#entry>label:nth-of-type(4) .row input{text-align:center;padding:9px 3px}#entry>label:nth-of-type(4) .row button{padding:9px}
#entry .row button[type=submit]{background:#7860b7}
.notice{padding:10px 12px;background:rgba(52,118,91,.15);border:1px solid rgba(104,195,148,.17);border-radius:9px;color:#abdfbe;margin-top:10px}
.record{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border-top:1px solid rgba(227,228,255,.09);padding:12px 0}
.record button{padding:6px 11px;font-size:12px}.record small{display:block;margin-top:3px;font-size:11px}.record strong{font-size:13px}.record .amount{text-align:right;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.record .row{justify-content:flex-end;margin-top:5px}
.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(214,213,255,.08)}.pill button{padding:6px 10px}
#records{margin-top:7px}
#records:empty:before{content:"尚無紀錄";color:#9298a9}
#formHeading.editing{color:#c5adff}
#status:empty{display:none}
@media(max-width:850px){main{max-width:700px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.workspace section{margin:0}.workspace{gap:12px}}
@media(max-width:530px){main{padding:14px 12px 75px}header{padding:13px;gap:8px;margin-bottom:17px}header small:last-child{font-size:10px;max-width:140px}h1{font-size:21px}.panel{padding:15px}.tile{padding:12px;min-height:86px}.tile b{font-size:19px}.grid{gap:8px}.workspace{margin-top:12px}.quick{gap:7px}.quick button{padding:8px 10px;min-height:36px;font-size:12px}.record{gap:6px}.record .row{gap:5px}.record button{padding:5px 8px}#entry{gap:9px}#entry>label:nth-of-type(4) .row{gap:5px}}
</style></head><body><main>
<header><small>PERSONAL FINANCE · V0.4</small><h1>Xiaoen Ledger</h1><small>本機儲存版 · 尚未跨裝置同步。重要資料請定期備份。</small></header>
<section class="grid"><div class="tile"><small>本月收入</small><b id="income">NT$ 0</b></div><div class="tile"><small>本月支出</small><b id="expense">NT$ 0</b></div><div class="tile"><small>本月結餘</small><b id="net">NT$ 0</b></div><div class="tile"><small>累計淨收支</small><b id="total">NT$ 0</b></div></section>
<div class="workspace"><section class="panel"><div class="summary"><h2>快速記帳</h2><button class="alt" id="manageQuick">編輯快捷</button></div><div class="quick" id="quick"></div></section>
<section class="panel" id="entryPanel"><h2 id="formHeading">新增紀錄</h2><div class="tabs"><button id="expenseTab" type="button">支出</button><button id="incomeTab" type="button">收入</button></div>
<form id="entry"><input id="editId" type="hidden"><label>金額 NT$<input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="輸入金額" required></label>
<label>分類<select id="category" required></select></label>
<label>項目名稱 / 備註<input id="note" maxlength="120" placeholder="例如：晚餐、加油"></label>
<label>日期（預設今天）<div class="row"><input id="year" aria-label="年" placeholder="年" inputmode="numeric" maxlength="4"><input id="month" aria-label="月" placeholder="月" inputmode="numeric" maxlength="2"><input id="day" aria-label="日" placeholder="日" inputmode="numeric" maxlength="2"><button type="button" class="alt" id="today">今天</button></div></label>
<div class="row"><button id="saveEntry" type="submit" style="flex:1">儲存紀錄</button><button type="button" class="alt" id="cancel">取消</button></div></form><div id="status" role="status" aria-live="polite"></div></section></div>
<section class="panel"><div class="summary"><h2>最近交易 <small id="rowCount"></small></h2><select id="filter" aria-label="篩選交易" style="width:130px"><option value="all">全部</option><option value="expense">支出</option><option value="income">收入</option></select></div><div id="records"></div></section>
<section class="panel"><h2>自訂分類</h2><div class="row"><select id="catType"><option value="expense">支出分類</option><option value="income">收入分類</option></select><input id="newCat" placeholder="新增分類名稱"><button id="addCat">新增</button></div><div id="catList"></div></section>
<section class="panel hidden" id="quickPanel"><h2>管理快捷交易</h2><form id="quickForm"><label>快捷名稱<input id="quickName" placeholder="例如：早餐" required maxlength="16"></label><label>圖示 Emoji<input id="quickEmoji" placeholder="🍞" maxlength="4"></label><label>分類<select id="quickCategory"></select></label><label>預設金額（可留空）<input id="quickAmount" type="number" min="0" step="1" placeholder="留空時每次輸入"></label><button type="submit">新增快捷</button></form><div id="quickList"></div></section>
<section class="panel"><h2>備份與還原</h2><p class="muted">使用同一個網站網址和瀏覽器才能看到本機資料。清除網站資料可能導致紀錄消失。</p><div class="row wrap"><button id="json" class="alt">匯出完整備份</button><button id="csv" class="alt">匯出 CSV</button><button id="import" class="alt">匯入 JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div></section>
</main><script>
'use strict';
const OLD='xiaoen-ledger-v1',KEY='xiaoen-ledger-v3';
const defaults={categories:{expense:['餐飲','飲料','交通','通行費','油錢','養貓','汽車保養','購物','娛樂','醫療','其他'],income:['薪水','業績獎金','年終','副業收入','其他']},quick:[{name:'晚餐',emoji:'🍱',category:'餐飲',amount:null},{name:'飲料',emoji:'🥤',category:'飲料',amount:null},{name:'通行費',emoji:'🛣️',category:'通行費',amount:null},{name:'油錢',emoji:'⛽',category:'油錢',amount:null},{name:'午餐',emoji:'🍜',category:'餐飲',amount:null},{name:'貓用品',emoji:'🐈',category:'養貓',amount:null},{name:'購物',emoji:'🛒',category:'購物',amount:null}]};
const $=id=>document.getElementById(id),fmt=n=>'NT$ '+n.toLocaleString('zh-TW'),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const clone=x=>JSON.parse(JSON.stringify(x));let data={rows:[],categories:clone(defaults.categories),quick:clone(defaults.quick)},type='expense';
try{const stored=localStorage.getItem(KEY);if(stored){const p=JSON.parse(stored);if(p&&Array.isArray(p.rows)&&p.categories&&Array.isArray(p.quick))data=p}else{const prior=JSON.parse(localStorage.getItem(OLD)||'[]');if(Array.isArray(prior))data.rows=prior}}catch(e){alert('讀取本機紀錄失敗，請先備份舊資料。')}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));return true}catch(e){alert('儲存失敗：瀏覽器可能阻擋網站儲存，或儲存空間已滿。');return false}}
function setDate(v){const [y,m,d]=v.split('-');$('year').value=y;$('month').value=+m;$('day').value=+d}
function dateValue(){const y=$('year').value,m=$('month').value,d=$('day').value;if(!/^\d{4}$/.test(y)||!/^\d{1,2}$/.test(m)||!/^\d{1,2}$/.test(d))return null;const v=new Date(+y,+m-1,+d);return v.getFullYear()===+y&&v.getMonth()+1===+m&&v.getDate()===+d?y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0'):null}
function options(select,values,chosen){select.replaceChildren();for(const x of values){const o=document.createElement('option');o.value=x;o.textContent=x;select.append(o)}if(chosen&&values.includes(chosen))select.value=chosen}
function choose(t){type=t;$('expenseTab').classList.toggle('selected',t==='expense');$('incomeTab').classList.toggle('selected',t==='income');options($('category'),data.categories[t]);}
$('expenseTab').onclick=()=>choose('expense');$('incomeTab').onclick=()=>choose('income');$('today').onclick=()=>setDate(today());
[['year','month',4],['month','day',2]].forEach(([a,b,len])=>$(a).addEventListener('input',()=>{if($(a).value.length===len)$(b).focus()}));
function reset(){ $('entry').reset();$('editId').value='';$('formHeading').textContent='新增紀錄';$('formHeading').classList.remove('editing');$('saveEntry').textContent='儲存紀錄';$('cancel').textContent='清除';choose('expense');setDate(today())}
$('cancel').onclick=reset;
function status(msg){$('status').className='notice';$('status').textContent=msg}
function makeButton(label,fn,cls='alt'){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=fn;return b}
function quickPick(q){reset();choose('expense');options($('category'),data.categories.expense,q.category);$('note').value=q.name;$('amount').value=q.amount??'';$('amount').focus();$('entry').scrollIntoView({behavior:'smooth',block:'center'})}
function renderQuick(){$('quick').replaceChildren();data.quick.forEach(q=>{const b=document.createElement('button');const e=document.createElement('span');e.textContent=q.emoji||'✦';const n=document.createElement('span');n.textContent=q.name;b.append(e,n);b.onclick=()=>quickPick(q);$('quick').append(b)});const add=makeButton('＋ 自訂',()=>{$('quickPanel').classList.remove('hidden');$('quickPanel').scrollIntoView({behavior:'smooth'})});$('quick').append(add);$('quickList').replaceChildren();data.quick.forEach((q,i)=>{const d=document.createElement('div');d.className='pill';const t=document.createElement('span');t.textContent=(q.emoji||'✦')+' '+q.name+' · '+q.category+(q.amount?' · '+fmt(q.amount):'');d.append(t,makeButton('刪除',()=>{if(!confirm('刪除此快捷？'))return;const next=clone(data);next.quick.splice(i,1);if(persist(next)){data=next;renderAll()}},'warn'));$('quickList').append(d)})}
$('manageQuick').onclick=()=>{$('quickPanel').classList.toggle('hidden');if(!$('quickPanel').classList.contains('hidden'))$('quickPanel').scrollIntoView({behavior:'smooth'})};
$('quickForm').onsubmit=e=>{e.preventDefault();const name=$('quickName').value.trim(),amount=$('quickAmount').value;if(!name)return;const next=clone(data);next.quick.push({name,emoji:$('quickEmoji').value.trim()||'✦',category:$('quickCategory').value,amount:amount===''?null:Number(amount)});if(!persist(next))return;data=next;$('quickForm').reset();renderAll()};
function renderCats(){options($('quickCategory'),data.categories.expense);const t=$('catType').value;$('catList').replaceChildren();data.categories[t].forEach(name=>{const d=document.createElement('div');d.className='pill';const n=document.createElement('span');n.textContent=name;d.append(n,makeButton('刪除',()=>{if(data.categories[t].length<=1)return alert('至少保留一個分類');if(data.rows.some(r=>r.type===t&&r.category===name)||data.quick.some(q=>t==='expense'&&q.category===name))return alert('這個分類仍被交易或快捷使用，請先調整相關項目');const next=clone(data);next.categories[t]=next.categories[t].filter(x=>x!==name);if(persist(next)){data=next;renderAll()}},'warn'));$('catList').append(d)})}
$('catType').onchange=renderCats;$('addCat').onclick=()=>{const name=$('newCat').value.trim(),t=$('catType').value;if(!name||name.length>20)return alert('請輸入 1～20 字分類名稱');if(data.categories[t].includes(name))return alert('分類已存在');const next=clone(data);next.categories[t].push(name);if(persist(next)){data=next;$('newCat').value='';renderAll();choose(t)}};
$('entry').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value),date=dateValue();if(!Number.isSafeInteger(amount)||amount<=0)return alert('金額必須是大於零的整數');if(!date)return alert('請確認日期');const id=$('editId').value;const original=id?data.rows.find(r=>String(r.id)===id):null;const record={id:original?original.id:('r'+Date.now()+Math.random().toString(36).slice(2)),type,amount,category:$('category').value,note:$('note').value.trim(),date};const next=clone(data);next.rows=id?next.rows.map(r=>String(r.id)===id?record:r):[...next.rows,record];if(!persist(next))return;data=next;reset();renderAll();status('✓ '+(id?'已更新':'已新增')+' '+record.category+' '+fmt(amount));$('amount').focus()};
function edit(id){const r=data.rows.find(x=>String(x.id)===String(id));if(!r)return;choose(r.type);$('editId').value=String(r.id);$('amount').value=r.amount;const cats=data.categories[r.type];if(!cats.includes(r.category))cats.push(r.category);options($('category'),cats,r.category);$('note').value=r.note||'';setDate(r.date);$('formHeading').textContent='正在編輯交易';$('formHeading').classList.add('editing');$('saveEntry').textContent='更新這筆交易';$('cancel').textContent='取消編輯';status('編輯完成後，按「更新這筆交易」，原紀錄與統計會同步更新。');$('entryPanel').scrollIntoView({behavior:'smooth',block:'start'});$('amount').focus({preventScroll:true})}
function remove(id){if(!confirm('確定刪除此筆紀錄？'))return;const next=clone(data);next.rows=next.rows.filter(r=>String(r.id)!==String(id));if(persist(next)){data=next;renderAll();status('紀錄已刪除')}}
function renderRows(){const month=today().slice(0,7),sum=(arr,t)=>arr.filter(r=>r.type===t).reduce((n,r)=>n+r.amount,0),cur=data.rows.filter(r=>r.date.startsWith(month)),inc=sum(cur,'income'),exp=sum(cur,'expense');$('income').textContent=fmt(inc);$('expense').textContent=fmt(exp);$('net').textContent=fmt(inc-exp);$('total').textContent=fmt(sum(data.rows,'income')-sum(data.rows,'expense'));$('records').replaceChildren();const filtered=data.rows.filter(r=>$('filter').value==='all'||r.type===$('filter').value).slice().sort((a,b)=>b.date.localeCompare(a.date));$('rowCount').textContent='· '+filtered.length+' 筆';if(!filtered.length){const p=document.createElement('p');p.className='muted';p.textContent='還沒有紀錄';$('records').append(p)}filtered.forEach(r=>{const d=document.createElement('div');d.className='record',left=document.createElement('div'),right=document.createElement('div'),name=document.createElement('strong'),sub=document.createElement('small'),money=document.createElement('div');name.textContent=r.note||r.category;sub.textContent=r.date+' · '+r.category;money.className='amount';money.textContent=(r.type==='expense'?'−':'+')+fmt(r.amount);left.append(name,sub);right.append(money);const buttons=document.createElement('div');buttons.className='row';buttons.append(makeButton('修改',()=>edit(r.id)),makeButton('刪除',()=>remove(r.id),'warn'));right.append(buttons);d.append(left,right);$('records').append(d)})}
$('filter').onchange=renderRows;
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('json').onclick=()=>download(JSON.stringify({version:3,...data},null,2),'xiaoen-backup-'+today()+'.json','application/json');
$('csv').onclick=()=>{const fields=['id','date','type','category','amount','note'];const lines=[fields.join(','),...data.rows.map(r=>fields.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))];download('\uFEFF'+lines.join('\r\n'),'xiaoen-'+today()+'.csv','text/csv;charset=utf-8')};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text()),rows=Array.isArray(p)?p:p.rows;if(!Array.isArray(rows)||!rows.every(r=>r&&typeof r.id==='string'&&['income','expense'].includes(r.type)&&Number.isSafeInteger(r.amount)&&r.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&typeof r.category==='string'))throw Error('交易格式錯誤');const next={rows,categories:p.categories&&Array.isArray(p.categories.expense)&&Array.isArray(p.categories.income)?p.categories:clone(data.categories),quick:Array.isArray(p.quick)?p.quick:clone(data.quick)};for(const r of rows)if(!next.categories[r.type].includes(r.category))next.categories[r.type].push(r.category);if(!confirm('匯入將取代目前全部資料，請先匯出備份。確定繼續？'))return;if(!persist(next))return;data=next;reset();renderAll();status('✓ 已匯入 '+rows.length+' 筆紀錄')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
function renderAll(){renderQuick();renderCats();renderRows();options($('category'),data.categories[type],$('category').value)}
reset();renderAll();
</script></body></html>
